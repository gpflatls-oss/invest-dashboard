<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>투자관리 대시보드</title>
<style>
:root {
  color-scheme: light;
  --page:           #f9f9f7;
  --surface:        #fcfcfb;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #898781;
  --hairline:       #e1e0d9;
  --border:         rgba(11,11,11,0.10);
  --wash:           rgba(11,11,11,0.04);
  --up:             #d03b3b;
  --down:           #256abf;
  --slot-1: #2a78d6;
  --slot-2: #eb6834;
  --slot-3: #1baf7a;
  --slot-4: #eda100;
  --slot-5: #e87ba4;
  --slot-6: #008300;
  --slot-7: #4a3aa7;
  /* 차트 잉크 — 지표 시계열은 계열이 하나뿐이라 색 하나로 충분하다.
     라이트/다크를 각각 골라 둔다 (자동 반전은 대비가 무너진다). */
  --chart-ink: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:           #0d0d0d;
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --hairline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
    --wash:           rgba(255,255,255,0.06);
    --up:             #e66767;
    --down:           #3987e5;
    --slot-1: #3987e5;
    --slot-2: #d95926;
    --slot-3: #199e70;
    --slot-4: #c98500;
    --slot-5: #d55181;
    --slot-6: #008300;
    --slot-7: #9085e9;
    --chart-ink: #3987e5;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:           #0d0d0d;
  --surface:        #1a1a19;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #898781;
  --hairline:       #2c2c2a;
  --border:         rgba(255,255,255,0.10);
  --wash:           rgba(255,255,255,0.06);
  --up:             #e66767;
  --down:           #3987e5;
  --slot-1: #3987e5;
  --slot-2: #d95926;
  --slot-3: #199e70;
  --slot-4: #c98500;
  --slot-5: #d55181;
  --slot-6: #008300;
  --slot-7: #9085e9;
  --chart-ink: #3987e5;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--page);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 24px 64px; }

/* ── 헤더 ── */
header {
  position: sticky; top: 0; z-index: 20;
  background: var(--page);   /* color-mix 미지원 브라우저용 기본값 */
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--hairline);
}
.head-inner {
  max-width: 1360px; margin: 0 auto; padding: 16px 24px;
  display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
}
h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.stamp { font-size: 13px; color: var(--text-secondary); }
.stamp b { font-weight: 600; color: var(--text-primary); }
.head-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
button.ghost {
  font: inherit; font-size: 13px; color: var(--text-secondary);
  background: transparent; border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 11px; cursor: pointer;
}
button.ghost:hover { background: var(--wash); color: var(--text-primary); }

/* ── 섹션 ── */
section { margin-top: 36px; }
.sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
h2 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
.sec-note { font-size: 12.5px; color: var(--text-muted); }
.badge-stale {
  font-size: 11px; color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px;
}

/* ── 지표 타일 ── */
.tiles {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
}
.tile {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 15px 13px;
}
.tile .label {
  font-size: 12.5px; color: var(--text-secondary);
  display: flex; align-items: center; gap: 6px; margin-bottom: 7px;
}
.tile .value {
  font-size: 25px; font-weight: 620; letter-spacing: -0.02em; line-height: 1.15;
}
.tile .value .unit {
  font-size: 12.5px; font-weight: 500; color: var(--text-muted);
  margin-left: 4px; letter-spacing: 0;
}
.tile .delta {
  font-size: 12.5px; font-variant-numeric: tabular-nums;
  margin-top: 5px; display: flex; align-items: center; gap: 5px;
}
.tile .delta.up   { color: var(--up); }
.tile .delta.down { color: var(--down); }
.tile .delta.flat { color: var(--text-muted); }
.tile .note { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; }

/* ── 필터 줄 ── */
.filters {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin-bottom: 16px;
}
.chip {
  font: inherit; font-size: 13px; cursor: pointer;
  background: var(--surface); color: var(--text-secondary);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 12px; display: inline-flex; align-items: center; gap: 7px;
}
.chip:hover { background: var(--wash); }
.chip[aria-pressed="true"] {
  color: var(--text-primary); font-weight: 600;
  border-color: currentColor;
  box-shadow: inset 0 0 0 1px var(--border);
}
.chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.chip .n { font-size: 11.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
input[type="search"] {
  font: inherit; font-size: 13px; color: var(--text-primary);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 11px; min-width: 210px; margin-left: auto;
}
input[type="search"]::placeholder { color: var(--text-muted); }

/* ── 뉴스 카드 ── */
.cards {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  align-items: start;
}
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: 9px;
  padding: 13px 15px 11px; border-bottom: 1px solid var(--hairline);
}
.card-head .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.card-head .title { font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
.card-head .sub { font-size: 11.5px; color: var(--text-muted); }
.card-head .count {
  margin-left: auto; font-size: 11.5px; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.news-list { list-style: none; margin: 0; padding: 4px 0; max-height: 520px; overflow-y: auto; }
.news-list li { border-bottom: 1px solid var(--hairline); }
.news-list li:last-child { border-bottom: 0; }
.news-list a { display: block; padding: 10px 15px; }
.news-list a:hover { background: var(--wash); }
.news-list .t {
  font-size: 13.5px; line-height: 1.45; color: var(--text-primary);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.news-list .m {
  font-size: 11.5px; color: var(--text-muted); margin-top: 3px;
  display: flex; gap: 6px; align-items: center;
}
.news-list .m .sep { opacity: 0.5; }
.news-list .m .intl {
  font-size: 10.5px; letter-spacing: 0.02em;
  border: 1px solid var(--border); border-radius: 4px;
  padding: 0 4px; color: var(--text-secondary); flex: none;
}
.empty { padding: 22px 15px; font-size: 13px; color: var(--text-muted); text-align: center; }

/* ── 안내 / 오류 ── */
.setup {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 24px 26px; margin-top: 36px;
}
.setup h2 { margin-bottom: 8px; }
.setup p { color: var(--text-secondary); font-size: 14px; margin: 6px 0; }
pre {
  background: var(--wash); border: 1px solid var(--border); border-radius: 8px;
  padding: 12px 14px; overflow-x: auto; font-size: 13px; margin: 12px 0 4px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.warn {
  font-size: 12.5px; color: var(--text-secondary);
  background: var(--wash); border: 1px solid var(--border);
  border-radius: 8px; padding: 9px 12px; margin-top: 12px;
}
footer {
  margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--hairline);
  font-size: 12px; color: var(--text-muted); line-height: 1.7;
}

/* ── 지표 차트 ── */
/* 시계열이 있는 타일은 눌러서 상세 차트를 연다 */
.tile.has-trend { cursor: pointer; }
.tile.has-trend:hover { border-color: var(--text-muted); }
.tile.has-trend:focus-visible { outline: 2px solid var(--chart-ink); outline-offset: 2px; }
.tile .spark { display: block; width: 100%; height: 34px; margin-top: 9px; overflow: visible; }
.tile .spark path { fill: none; stroke: var(--chart-ink); stroke-width: 2;
                    stroke-linejoin: round; stroke-linecap: round;
                    vector-effect: non-scaling-stroke; }
.tile .spark-range {
  font-size: 11px; color: var(--text-muted); margin-top: 2px;
  display: flex; justify-content: space-between; font-variant-numeric: tabular-nums;
}

/* ── 상세 차트 시트 ── */
.sheet {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0,0,0,0.42);
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.sheet[hidden] { display: none; }
.sheet-inner {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  width: min(860px, 100%); max-height: 100%; overflow-y: auto; padding: 20px 22px 18px;
}
.sheet-head { display: flex; align-items: flex-start; gap: 12px; }
.sheet-title { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.sheet-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; }
.sheet-head .ghost { margin-left: auto; flex: none; }
/* 범위 선택은 차트 위 한 줄에 모은다 */
.sheet-controls {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  margin: 14px 0 10px;
}
.sheet-controls .ghost { margin-left: auto; }
.chart-box { position: relative; }
.chart-box svg { display: block; width: 100%; height: auto; }
.chart-box .grid line, .chart-box .axis line {
  stroke: var(--hairline); stroke-width: 1; shape-rendering: crispEdges;
}
.chart-box .series { fill: none; stroke: var(--chart-ink); stroke-width: 2;
                     stroke-linejoin: round; stroke-linecap: round; }
.chart-box .area { fill: var(--chart-ink); opacity: 0.10; stroke: none; }
.chart-box .tick {
  font-size: 11px; fill: var(--text-muted); font-variant-numeric: tabular-nums;
}
.chart-box .cross { stroke: var(--text-muted); stroke-width: 1; opacity: 0.55; }
.chart-box .hot { fill: var(--chart-ink); stroke: var(--surface); stroke-width: 2; }
.chart-box .endcap { fill: var(--chart-ink); stroke: var(--surface); stroke-width: 2; }
.tip {
  position: absolute; pointer-events: none; z-index: 2;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 9px; font-size: 12px; line-height: 1.4; white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0,0,0,0.14); transform: translate(-50%, -120%);
}
.tip .d { color: var(--text-muted); font-size: 11px; }
.tip .v { font-weight: 620; font-variant-numeric: tabular-nums; }
.chart-foot {
  display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px;
  font-size: 12.5px; color: var(--text-secondary);
}
.chart-foot b { font-weight: 620; color: var(--text-primary); font-variant-numeric: tabular-nums; }
/* 표 보기 — 툴팁이 값에 이르는 유일한 통로가 되지 않게 한다 */
.table-wrap { margin-top: 14px; max-height: 320px; overflow-y: auto; }
.table-wrap[hidden] { display: none; }
.table-wrap table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
.table-wrap th, .table-wrap td {
  text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--hairline);
  font-variant-numeric: tabular-nums;
}
.table-wrap th:first-child, .table-wrap td:first-child { text-align: left; }
.table-wrap th {
  position: sticky; top: 0; background: var(--surface);
  color: var(--text-secondary); font-weight: 600;
}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <h1>투자관리 대시보드</h1>
    <div class="stamp" id="stamp"></div>
    <div class="head-actions">
      <button class="ghost" id="theme-btn" type="button">테마</button>
      <button class="ghost" id="reload-btn" type="button">새로고침</button>
    </div>
  </div>
</header>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-inner">
    <div class="sheet-head">
      <div>
        <div class="sheet-title" id="sheet-title"></div>
        <div class="sheet-sub" id="sheet-sub"></div>
      </div>
      <button class="ghost" type="button" id="sheet-close">닫기</button>
    </div>
    <div class="sheet-controls" id="sheet-ranges"></div>
    <div class="chart-box" id="chart-box"></div>
    <div class="chart-foot" id="chart-foot"></div>
    <div class="table-wrap" id="chart-table" hidden></div>
  </div>
</div>

<div class="wrap">
  <div id="root"></div>
  <footer>
    데이터 출처 · 환율·금리·원자재: 네이버 금융 시장지표(하나은행·신한은행·NYMEX·COMEX·모닝스타·ICE 고시 기준) /
    주가지수: 네이버 금융 지수 시세(한국거래소 및 각 해외 거래소) / 뉴스: Google 뉴스 검색(한국어).<br>
    표시된 수치는 고시·체결 시점 기준의 참고용 정보이며 실시간 호가나 투자 판단의 근거로 사용하기에는
    지연·오차가 있을 수 있습니다. 값을 다시 받아오려면 <code>갱신.bat</code>을 실행하세요.
  </footer>
</div>

<script>
// GitHub Pages 는 data.js 를 10분 동안 캐시한다 (Cache-Control: max-age=600).
// 그대로 두면 갱신 직후 사이트를 열어도 브라우저·CDN 이 묵은 값을 내줘
// "로컬은 바뀌었는데 사이트는 그대로"가 된다. 매 로드마다 주소를 바꿔 우회한다.
// file:// 로 열었을 때도 그대로 동작한다.
document.write('<script src="data.js?v=' + Date.now() + '"><\/script>');
</script>
<script>
(function () {
  "use strict";

  var root = document.getElementById("root");
  var DATA = window.DASHBOARD_DATA || null;

  /* ── 테마 토글 ── */
  var saved = null;
  try { saved = localStorage.getItem("dash-theme"); } catch (e) {}
  if (saved) { document.documentElement.setAttribute("data-theme", saved); }
  document.getElementById("theme-btn").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var isDark = cur ? cur === "dark"
                     : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("dash-theme", next); } catch (e) {}
  });
  document.getElementById("reload-btn").addEventListener("click", function () {
    location.reload();
  });

  /* ── 유틸 ── */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = text; }
    return n;
  }

  var ARROW = { up: "▲", down: "▼", flat: "—" };
  var DIRWORD = { up: "상승", down: "하락", flat: "보합" };

  function relTime(iso) {
    if (!iso) { return ""; }
    var t = Date.parse(iso);
    if (isNaN(t)) { return ""; }
    var mins = Math.round((Date.now() - t) / 60000);
    if (mins < 1) { return "방금"; }
    if (mins < 60) { return mins + "분 전"; }
    var hrs = Math.round(mins / 60);
    if (hrs < 24) { return hrs + "시간 전"; }
    var days = Math.round(hrs / 24);
    if (days < 7) { return days + "일 전"; }
    var d = new Date(t);
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일";
  }

  function slotColor(slot) { return "var(--slot-" + (((slot - 1) % 7) + 1) + ")"; }

  /* ── 데이터 없을 때 안내 ── */
  if (!DATA) {
    var setup = el("div", "setup");
    setup.appendChild(el("h2", null, "먼저 데이터를 받아오세요"));
    setup.appendChild(el("p", null,
      "화면에 표시할 data.js 파일이 아직 없습니다. 이 폴더의 갱신.bat 파일을 더블클릭하면 데이터를 받아옵니다."));
    setup.appendChild(el("p", null,
      "PowerShell 창에서 직접 실행하려면 아래 명령을 쓰세요."));
    setup.appendChild(el("pre", null,
      'cd "$HOME\\OneDrive\\Desktop\\CC_자산군별뉴스"\npowershell -ExecutionPolicy Bypass -File .\\refresh.ps1'));
    setup.appendChild(el("p", null,
      "실행이 끝나면 이 페이지에서 새로고침 버튼을 누르세요. 별도 설치 없이 Windows 기본 PowerShell로 동작합니다."));
    root.appendChild(setup);
    document.getElementById("stamp").textContent = "데이터 없음";
    return;
  }

  /* ── 기준시각 ── */
  var stamp = document.getElementById("stamp");
  stamp.appendChild(el("span", null, "기준 "));
  stamp.appendChild(el("b", null, DATA.generated_at_display || "-"));
  var age = relTime(DATA.generated_at);
  if (age) { stamp.appendChild(el("span", null, " · " + age + " 수집")); }

  /* ── 시장 지표 ── */
  var TILES = [];   // 시계열을 붙일 타일들 (code 가 있는 것만)

  (DATA.market || []).forEach(function (group) {
    var sec = el("section");
    var head = el("div", "sec-head");
    head.appendChild(el("h2", null, group.label));
    if (group.note) { head.appendChild(el("span", "sec-note", group.note)); }
    if (group.stale) { head.appendChild(el("span", "badge-stale", "이전 수집값")); }
    sec.appendChild(head);

    if (!group.items || !group.items.length) {
      sec.appendChild(el("div", "warn", group.label + " 데이터를 받아오지 못했습니다. refresh.py를 다시 실행해 보세요."));
      root.appendChild(sec);
      return;
    }

    var grid = el("div", "tiles");
    group.items.forEach(function (m) {
      var tile = el("div", "tile");
      tile.appendChild(el("div", "label", m.name));

      var value = el("div", "value", m.value === null ? "-" : m.value);
      if (m.unit) { value.appendChild(el("span", "unit", m.unit)); }
      tile.appendChild(value);

      var dir = m.dir || "flat";
      var hasChange = m.change !== null && m.change !== undefined;
      if (hasChange) {
        var delta = el("div", "delta " + dir);
        delta.appendChild(el("span", null, ARROW[dir] || ARROW.flat));
        var text = String(m.change).replace("-", "") + (m.change_unit || "");
        if (m.ratio !== null && m.ratio !== undefined) {
          text += " (" + (m.ratio >= 0 ? "+" : "-") +
                  Math.abs(m.ratio).toFixed(2) + "%)";
        }
        delta.appendChild(el("span", null, text));
        // 방향은 색만으로 전달하지 않는다 — 기호와 단어를 함께 표기
        delta.appendChild(el("span", null, DIRWORD[dir] || ""));
        tile.appendChild(delta);
      } else {
        tile.appendChild(el("div", "delta flat", "전일대비 정보 없음"));
      }

      var noteText = [m.note, m.asof].filter(Boolean).join(" · ");
      var noteEl = null;
      if (noteText) { noteEl = el("div", "note", noteText); tile.appendChild(noteEl); }

      // 이력은 나중에(history.csv 를 받은 뒤) 여기에 끼워 넣는다
      if (m.code) {
        TILES.push({ code: m.code, name: m.name, unit: m.unit || "",
                     tile: tile, before: noteEl });
      }
      grid.appendChild(tile);
    });
    sec.appendChild(grid);
    root.appendChild(sec);
  });

  /* ── 지표 시계열 (history.csv) ──────────────────────────────
     history.csv 는 refresh.ps1 이 매 실행마다 그날 값을 덧붙이는 파일이다.
     data.js 처럼 script 태그로 못 읽고 fetch 를 써야 하는데, 브라우저는
     file:// 에서 fetch 를 막는다. 그래서 실패하면 조용히 접는다 —
     타일은 지금까지와 똑같이 보이고 차트만 없다.
     (로컬에서도 보려면 이 폴더에서 간이 서버를 띄우면 된다.) */

  var SVGNS = "http://www.w3.org/2000/svg";
  function svg(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    if (attrs) { Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); }); }
    return n;
  }

  // 계열의 값 폭에 맞춰 소수 자릿수를 정한다.
  // 금리(3.742)와 지수(66,074)를 같은 규칙으로 찍으면 한쪽이 반드시 깨진다.
  function decimalsFor(span) {
    if (span >= 1000) { return 0; }
    if (span >= 100)  { return 1; }
    if (span >= 10)   { return 2; }
    if (span >= 1)    { return 3; }
    return 4;
  }
  function fmt(v, dec) {
    return v.toLocaleString("ko-KR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  }
  function fmtLoose(v) {   // 툴팁·표: 불필요한 0 은 떼고 보여준다
    return parseFloat(v.toFixed(4)).toLocaleString("ko-KR", { maximumFractionDigits: 4 });
  }
  function shortDate(d) { return d.slice(2).replace(/-/g, "."); }

  /* 두 날짜 사이를 사람이 읽는 기간으로. 관측 건수(영업일)는 휴장일이
     빠져 있어 "933일"처럼 실제 기간과 어긋나 보인다. 달 단위로 센다. */
  function spanLabel(from, to) {
    var p = from.split("-"), q = to.split("-");
    var m = (q[0] - p[0]) * 12 + (q[1] - p[1]);
    if (+q[2] < +p[2]) { m -= 1; }
    if (m < 1) {
      var days = Math.round((Date.parse(to) - Date.parse(from)) / 86400000);
      return Math.max(days, 1) + "일";
    }
    if (m < 24) { return m + "개월"; }
    var y = Math.floor(m / 12), r = m % 12;
    return r ? y + "년 " + r + "개월" : y + "년";
  }

  function parseHistory(text) {
    var out = {};
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line || line.charAt(0) === "d") { continue; }   // 헤더/빈 줄
      var a = line.indexOf(","), b = line.indexOf(",", a + 1);
      if (a < 0 || b < 0) { continue; }
      var code = line.slice(a + 1, b);
      var v = parseFloat(line.slice(b + 1));
      if (isNaN(v)) { continue; }
      (out[code] || (out[code] = [])).push([line.slice(0, a), v]);
    }
    // history.csv 는 날짜순으로 쓰이지만, 손으로 고쳤을 수도 있으니 한 번 세운다
    Object.keys(out).forEach(function (k) {
      out[k].sort(function (p, q) { return p[0] < q[0] ? -1 : p[0] > q[0] ? 1 : 0; });
    });
    return out;
  }

  /* 타일 안 스파크라인. 폭은 타일에 맞춰 늘어나므로 viewBox 를 늘리고
     선 굵기는 non-scaling-stroke 로 고정한다 (CSS). */
  function sparkline(points) {
    var W = 200, H = 34, PAD = 3;
    var vals = points.map(function (p) { return p[1]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var span = hi - lo || 1;
    var n = points.length;
    var d = "";
    for (var i = 0; i < n; i++) {
      var x = n === 1 ? W / 2 : (i / (n - 1)) * W;
      var y = PAD + (1 - (points[i][1] - lo) / span) * (H - PAD * 2);
      d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    }
    var s = svg("svg", {
      "class": "spark", viewBox: "0 0 " + W + " " + H,
      preserveAspectRatio: "none", "aria-hidden": "true", focusable: "false"
    });
    s.appendChild(svg("path", { d: d }));
    return s;
  }

  /* ── 상세 차트 시트 ── */
  var sheet = document.getElementById("sheet");
  var sheetTitle = document.getElementById("sheet-title");
  var sheetSub = document.getElementById("sheet-sub");
  var sheetRanges = document.getElementById("sheet-ranges");
  var chartBox = document.getElementById("chart-box");
  var chartFoot = document.getElementById("chart-foot");
  var chartTable = document.getElementById("chart-table");
  var tableBtn = null;
  var lastFocus = null;
  var current = null;                       // { code, name, unit, points }
  var RANGES = [
    { key: "3M", label: "3개월", days: 92 },
    { key: "1Y", label: "1년",   days: 366 },
    { key: "3Y", label: "3년",   days: 1097 },
    { key: "ALL", label: "전체", days: 0 }
  ];
  var activeRange = "1Y";

  function sliceRange(points, days) {
    if (!days) { return points; }
    var last = new Date(points[points.length - 1][0] + "T00:00:00Z").getTime();
    var from = last - days * 86400000;
    return points.filter(function (p) {
      return new Date(p[0] + "T00:00:00Z").getTime() >= from;
    });
  }

  function drawChart(points) {
    chartBox.textContent = "";
    if (points.length < 2) {
      chartBox.appendChild(el("div", "empty", "이 구간에 표시할 값이 없습니다."));
      return;
    }

    var W = Math.max(320, chartBox.clientWidth || 760);
    var H = 300;
    var L = 62, R = 18, T = 14, B = 30;      // x축 글자가 잘리지 않게 아래를 비워 둔다
    var pw = W - L - R, ph = H - T - B;

    var vals = points.map(function (p) { return p[1]; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (lo === hi) { lo -= 0.5; hi += 0.5; }
    var pad = (hi - lo) * 0.08;
    lo -= pad; hi += pad;
    var dec = decimalsFor(hi - lo);
    var n = points.length;

    function X(i) { return L + (n === 1 ? pw / 2 : (i / (n - 1)) * pw); }
    function Y(v) { return T + (1 - (v - lo) / (hi - lo)) * ph; }

    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, role: "img",
                         "aria-label": current.name + " 시계열 차트" });

    // 가로 격자 + y축 눈금 (실선 헤어라인, 점선 금지)
    var g = svg("g", { "class": "grid" });
    var TICKS = 4;
    for (var t = 0; t <= TICKS; t++) {
      var v = lo + (hi - lo) * (t / TICKS), y = Y(v);
      g.appendChild(svg("line", { x1: L, y1: y, x2: L + pw, y2: y }));
      var lbl = svg("text", { "class": "tick", x: L - 8, y: y + 3.5, "text-anchor": "end" });
      lbl.textContent = fmt(v, dec);
      g.appendChild(lbl);
    }
    s.appendChild(g);

    // x축 날짜 (양끝 포함 5개 안팎)
    var ax = svg("g", { "class": "axis" });
    ax.appendChild(svg("line", { x1: L, y1: T + ph, x2: L + pw, y2: T + ph }));
    var STEPS = Math.min(5, n);
    for (var k = 0; k < STEPS; k++) {
      var idx = Math.round((k / (STEPS - 1 || 1)) * (n - 1));
      var tx = svg("text", { "class": "tick", x: X(idx), y: T + ph + 17,
                             "text-anchor": k === 0 ? "start" : (k === STEPS - 1 ? "end" : "middle") });
      tx.textContent = shortDate(points[idx][0]);
      ax.appendChild(tx);
    }
    s.appendChild(ax);

    // 면적(10% 워시) + 선
    var d = "", i;
    for (i = 0; i < n; i++) { d += (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(points[i][1]).toFixed(1); }
    s.appendChild(svg("path", { "class": "area",
      d: d + "L" + X(n - 1).toFixed(1) + " " + (T + ph) + "L" + X(0).toFixed(1) + " " + (T + ph) + "Z" }));
    s.appendChild(svg("path", { "class": "series", d: d }));

    // 끝점만 직접 표시한다 (모든 점에 숫자를 붙이지 않는다)
    s.appendChild(svg("circle", { "class": "endcap", cx: X(n - 1), cy: Y(points[n - 1][1]), r: 4 }));

    // 십자선 + 툴팁
    var cross = svg("line", { "class": "cross", y1: T, y2: T + ph, x1: -99, x2: -99 });
    var hot = svg("circle", { "class": "hot", r: 4.5, cx: -99, cy: -99 });
    cross.style.display = "none"; hot.style.display = "none";
    s.appendChild(cross); s.appendChild(hot);

    var tip = el("div", "tip");
    tip.hidden = true;
    chartBox.appendChild(s);
    chartBox.appendChild(tip);

    // 히트 영역은 마크보다 넓게 — 점을 정확히 짚을 필요가 없다
    var hit = svg("rect", { x: L, y: T, width: pw, height: ph, fill: "transparent" });
    s.appendChild(hit);

    function moveTo(clientX) {
      var box = s.getBoundingClientRect();
      var px = (clientX - box.left) / box.width * W;
      var i = Math.round(((px - L) / pw) * (n - 1));
      if (i < 0) { i = 0; } if (i > n - 1) { i = n - 1; }
      var x = X(i), y = Y(points[i][1]);
      cross.setAttribute("x1", x); cross.setAttribute("x2", x);
      hot.setAttribute("cx", x); hot.setAttribute("cy", y);
      cross.style.display = ""; hot.style.display = "";
      tip.textContent = "";
      tip.appendChild(el("div", "d", points[i][0]));
      tip.appendChild(el("div", "v", fmtLoose(points[i][1]) + (current.unit ? " " + current.unit : "")));
      tip.hidden = false;
      // 툴팁이 차트 밖으로 삐져나가 가로 스크롤을 만들지 않도록 가둔다
      var scale = box.width / W;
      var half = tip.offsetWidth / 2 + 4;
      var px2 = Math.min(Math.max(x * scale, half), box.width - half);
      tip.style.left = px2 + "px";
      tip.style.top = Math.max(y * scale, 34) + "px";
    }
    function clear() { cross.style.display = "none"; hot.style.display = "none"; tip.hidden = true; }

    s.addEventListener("mousemove", function (e) { moveTo(e.clientX); });
    s.addEventListener("mouseleave", clear);
    s.addEventListener("touchmove", function (e) {
      if (e.touches[0]) { moveTo(e.touches[0].clientX); }
    }, { passive: true });
    s.addEventListener("touchend", clear);

    // 요약 — 툴팁 없이도 핵심 수치는 읽을 수 있어야 한다
    var first = points[0][1], last = points[n - 1][1];
    var diff = last - first;
    var pct = first ? (diff / first) * 100 : 0;
    chartFoot.textContent = "";
    function stat(label, value) {
      var w = el("span", null, label + " ");
      w.appendChild(el("b", null, value));
      chartFoot.appendChild(w);
    }
    // 자릿수는 y축 눈금과 맞춘다. 요약만 다른 정밀도로 찍히면 같은 값이
    // 두 군데서 달라 보인다. 원값은 툴팁과 표에 그대로 있다.
    stat("최근", fmt(last, dec) + (current.unit ? " " + current.unit : ""));
    stat("구간 최저", fmt(Math.min.apply(null, vals), dec));
    stat("구간 최고", fmt(Math.max.apply(null, vals), dec));
    stat("구간 변화", (diff >= 0 ? "+" : "−") + fmt(Math.abs(diff), dec) +
                      " (" + (pct >= 0 ? "+" : "−") + Math.abs(pct).toFixed(2) + "%)");
    stat("구간", spanLabel(points[0][0], points[n - 1][0]));
  }

  function buildTable(points) {
    chartTable.textContent = "";
    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var hr = document.createElement("tr");
    ["날짜", "값" + (current.unit ? " (" + current.unit + ")" : "")].forEach(function (h) {
      var th = document.createElement("th"); th.textContent = h; hr.appendChild(th);
    });
    thead.appendChild(hr); table.appendChild(thead);
    var tb = document.createElement("tbody");
    // 최근 날짜가 위로 오게
    for (var i = points.length - 1; i >= 0; i--) {
      var tr = document.createElement("tr");
      var td1 = document.createElement("td"); td1.textContent = points[i][0];
      var td2 = document.createElement("td"); td2.textContent = fmtLoose(points[i][1]);
      tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
    }
    table.appendChild(tb);
    chartTable.appendChild(table);
  }

  function renderSheet() {
    var range = RANGES.filter(function (r) { return r.key === activeRange; })[0] || RANGES[1];
    var pts = sliceRange(current.points, range.days);
    drawChart(pts);
    buildTable(pts);
    Array.prototype.forEach.call(sheetRanges.querySelectorAll("[data-range]"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-range") === activeRange ? "true" : "false");
    });
  }

  function openSheet(rec) {
    current = rec;
    lastFocus = document.activeElement;
    sheetTitle.textContent = rec.name;
    sheetSub.textContent = rec.points[0][0] + " ~ " + rec.points[rec.points.length - 1][0] +
                           " · " + spanLabel(rec.points[0][0], rec.points[rec.points.length - 1][0]) +
                           " · 코드 " + rec.code;
    chartTable.hidden = true;
    if (tableBtn) { tableBtn.textContent = "표로 보기"; }
    sheet.hidden = false;
    renderSheet();
    document.getElementById("sheet-close").focus();
  }

  function closeSheet() {
    sheet.hidden = true;
    current = null;
    if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
  }

  RANGES.forEach(function (r) {
    var b = el("button", "chip", r.label);
    b.type = "button";
    b.setAttribute("data-range", r.key);
    b.setAttribute("aria-pressed", r.key === activeRange ? "true" : "false");
    b.addEventListener("click", function () { activeRange = r.key; renderSheet(); });
    sheetRanges.appendChild(b);
  });
  tableBtn = el("button", "ghost", "표로 보기");
  tableBtn.type = "button";
  tableBtn.addEventListener("click", function () {
    chartTable.hidden = !chartTable.hidden;
    tableBtn.textContent = chartTable.hidden ? "표로 보기" : "표 숨기기";
  });
  sheetRanges.appendChild(tableBtn);

  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  sheet.addEventListener("click", function (e) { if (e.target === sheet) { closeSheet(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !sheet.hidden) { closeSheet(); }
  });
  window.addEventListener("resize", function () { if (current) { renderSheet(); } });

  function attachTrends(hist) {
    TILES.forEach(function (rec) {
      var points = hist[rec.code];
      if (!points || points.length < 2) { return; }
      rec.points = points;

      var spark = sparkline(points);
      if (rec.before) { rec.tile.insertBefore(spark, rec.before); }
      else { rec.tile.appendChild(spark); }

      var range = el("div", "spark-range");
      range.appendChild(el("span", null, shortDate(points[0][0]) + " ~"));
      range.appendChild(el("span", null, spanLabel(points[0][0], points[points.length - 1][0])));
      if (rec.before) { rec.tile.insertBefore(range, rec.before); }
      else { rec.tile.appendChild(range); }

      rec.tile.classList.add("has-trend");
      rec.tile.setAttribute("tabindex", "0");
      rec.tile.setAttribute("role", "button");
      rec.tile.setAttribute("aria-label", rec.name + " 시계열 차트 열기");
      rec.tile.addEventListener("click", function () { openSheet(rec); });
      rec.tile.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(rec); }
      });
    });
  }

  /* 이력을 읽어 온다.
     1) history.csv 를 fetch — 서버(GitHub Pages·로컬 서버)에서 쓰는 길.
     2) 실패하면 history.js 를 script 로 끼워 넣는다 — index.html 을
        더블클릭해서 열면(file://) 브라우저가 fetch 를 막기 때문이다.
        script 태그는 file:// 에서도 되므로 data.js 와 같은 방식이다.
     둘 다 없으면 조용히 접는다. 타일은 지금까지와 똑같이 보인다. */
  function loadHistoryJs(done) {
    if (window.DASHBOARD_HISTORY) { done(window.DASHBOARD_HISTORY); return; }
    var s = document.createElement("script");
    s.src = "history.js";
    s.onload = function () {
      if (window.DASHBOARD_HISTORY) { done(window.DASHBOARD_HISTORY); }
    };
    s.onerror = function () { /* 아직 한 번도 수집하지 않았다 */ };
    document.head.appendChild(s);
  }

  if (TILES.length) {
    if (window.fetch) {
      fetch("history.csv", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) { throw new Error(r.status); } return r.text(); })
        .then(function (text) { attachTrends(parseHistory(text)); })
        .catch(function () { loadHistoryJs(attachTrends); });
    } else {
      loadHistoryJs(attachTrends);
    }
  }

  /* ── 자산군별 뉴스 ── */
  var classes = DATA.news || [];
  var newsSec = el("section");
  var nHead = el("div", "sec-head");
  nHead.appendChild(el("h2", null, "자산군별 뉴스"));
  var totalCount = classes.reduce(function (a, c) { return a + (c.items || []).length; }, 0);
  nHead.appendChild(el("span", "sec-note",
    "최근 " + (DATA.news_window_days || 30) + "일 · 총 " + totalCount + "건"));
  newsSec.appendChild(nHead);

  var filters = el("div", "filters");
  var active = "all";
  var query = "";

  var chips = [];
  function makeChip(key, label, color, count) {
    var chip = el("button", "chip");
    chip.type = "button";
    chip.setAttribute("aria-pressed", key === "all" ? "true" : "false");
    if (color) {
      var dot = el("span", "dot");
      dot.style.background = color;
      chip.appendChild(dot);
    }
    chip.appendChild(el("span", null, label));
    chip.appendChild(el("span", "n", String(count)));
    chip.addEventListener("click", function () {
      active = (active === key && key !== "all") ? "all" : key;
      chips.forEach(function (c) {
        c.el.setAttribute("aria-pressed", c.key === active ? "true" : "false");
      });
      render();
    });
    chips.push({ key: key, el: chip });
    filters.appendChild(chip);
    return chip;
  }

  makeChip("all", "전체", null, totalCount);
  classes.forEach(function (c) {
    makeChip(c.key, c.label, slotColor(c.slot), (c.items || []).length);
  });

  var search = document.createElement("input");
  search.type = "search";
  search.placeholder = "제목·매체 검색";
  search.addEventListener("input", function () {
    query = search.value.trim().toLowerCase();
    render();
  });
  filters.appendChild(search);
  newsSec.appendChild(filters);

  var cards = el("div", "cards");
  newsSec.appendChild(cards);
  root.appendChild(newsSec);

  function matches(item) {
    if (!query) { return true; }
    return (item.title + " " + (item.source || "")).toLowerCase().indexOf(query) >= 0;
  }

  function render() {
    cards.textContent = "";
    var shown = 0;

    classes.forEach(function (c) {
      if (active !== "all" && active !== c.key) { return; }
      var items = (c.items || []).filter(matches);
      if (query && !items.length) { return; }
      shown++;

      var card = el("div", "card");
      var head = el("div", "card-head");
      var dot = el("span", "dot");
      dot.style.background = slotColor(c.slot);
      head.appendChild(dot);
      var titleBox = el("div");
      titleBox.appendChild(el("div", "title", c.label));
      if (c.sublabel) { titleBox.appendChild(el("div", "sub", c.sublabel)); }
      head.appendChild(titleBox);
      var count = el("span", "count", items.length + "건");
      if (c.stale) { count.textContent = items.length + "건 · 이전 수집값"; }
      head.appendChild(count);
      card.appendChild(head);

      if (!items.length) {
        card.appendChild(el("div", "empty",
          "최근 " + (DATA.news_window_days || 30) + "일 내 수집된 기사가 없습니다."));
      } else {
        var list = el("ul", "news-list");
        items.forEach(function (item) {
          var li = el("li");
          var a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.appendChild(el("div", "t", item.title));
          // 해외 기사는 원문 제목이 영어다 — 마우스를 올리면 원문을 보여준다
          if (item.intl && item.title_en) { a.title = item.title_en; }
          var meta = el("div", "m");
          if (item.intl) { meta.appendChild(el("span", "intl", "해외·번역")); }
          if (item.source) { meta.appendChild(el("span", null, item.source)); }
          var rel = relTime(item.published);
          if (item.source && rel) { meta.appendChild(el("span", "sep", "·")); }
          if (rel) { meta.appendChild(el("span", null, rel)); }
          a.appendChild(meta);
          li.appendChild(a);
          list.appendChild(li);
        });
        card.appendChild(list);
      }
      cards.appendChild(card);
    });

    if (!shown) {
      cards.appendChild(el("div", "empty", "검색 결과가 없습니다."));
    }
  }

  render();

  /* ── 수집 경고 ── */
  if (DATA.errors && DATA.errors.length) {
    var warn = el("div", "warn",
      "수집 경고 " + DATA.errors.length + "건: " + DATA.errors.join(" / "));
    root.appendChild(warn);
  }
})();
</script>
</body>
</html>
